name: meeting_ai_mobile
description: Meeting AI - Mobile version mirroring the web app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # Networking & Storage
  http: ^1.2.1
  flutter_secure_storage: ^9.0.0

  # State management
  provider: ^6.1.2

  # Charts
  fl_chart: ^1.1.1

  # File picker
  file_picker: ^10.0.0

  # Audio recording
  record: ^6.2.0

  # Audio playback
  just_audio: ^0.9.38
  audio_session: ^0.1.21

  # Google Fonts
  google_fonts: ^8.0.0

  # Intl
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.6
  open_file: ^4.0.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
